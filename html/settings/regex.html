<div id="ch-tab-regex">
    <div class="st-chatu8-settings-section">
        <h3>Cài đặt thông thường</h3>
        <lớp div="st-chatu8-field">
            <label for="ch-regex-profile-select">Cấu hình thông thường</label>
            <lớp div="st-chatu8-profile-controls">
                <select id="ch-regex-profile-select" class="st-chatu8-select"></select>
                <button class="st-chatu8-icon-btn" id="ch-new-regex-profile-button" title="Mới"><i class="fa-solid fa-plus"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-save-regex-profile-button" title="lưu lại"><i class="fa-solid fa-save"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-save-as-regex-profile-button" title="lưu dưới dạng"><i class="fa-solid fa-floppy-disk"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-import-regex-profile-button" title="nhập khẩu"><i class="fa-solid fa-file-import"></i></button>
                <button class="st-chatu8-icon-btn" id="ch-export-regex-profile-button" title="Xuất khẩu"><i class="fa-solid fa-file-export"></i></button>
                <button class="st-chatu8-icon-btn danger" id="ch-delete-regex-profile-button" title="Xóa"><i class="fa-solid fa-trash"></i></button>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-before-after-editor">Trước và sau đều đặn (dùng để cắt phần văn bản xung quanh)</label>
            <id vùng văn bản="ch-regex-before-after-editor" class="st-chatu8-textarea" rows="3" placeholder="Nhập biểu thức chính quy..."></textarea>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-text-editor">Tính đều đặn của văn bản (dùng để thay thế nội dung)</label>
            <id vùng văn bản="ch-regex-text-editor" class="st-chatu8-textarea" rows="5" placeholder="Nhập biểu thức chính quy..."></textarea>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>Trình chỉnh sửa mặc định thông thường</h4>
        <lớp div="st-chatu8-field">
            <div class="st-chatu8-profile-controls">
                <button class="st-chatu8-btn" id="ch-add-regex-entry-button" title="Tạo một mục nhập thông thường mới">
                    <i class="fa-solid fa-plus"></i> Mới
                </button>
                <lớp nút="st-chatu8-btn" id="ch-import-regex-entry-button" title="Nhập các mục thông thường">
                    <i class="fa-solid fa-file-import"></i>Nhập khẩu
                </button>
                <lớp nút="st-chatu8-btn" id="ch-import-regex-entry-engine-button" title="Nhập từ động cơ ST thông thường">
                    <i class="fa-solid fa-download"></i> Nhập từ động cơ ST
                </button>
            </div>
        </div>
        <div id="ch-regex-entries-container" class="st-chatu8-preset-entries-container">
            <!-- Các mục nhập thông thường sẽ được hiển thị động tại đây -->
        </div>
    </div>
    <lớp div="st-chatu8-settings-section">
        <h4>Ghi cử chỉ</h4>
        <lớp div="st-chatu8-field">
            <label for="ch-gesture-enabled">Chuyển đổi chức năng cử chỉ</label>
            <lớp div="st-chatu8-toggle">
                <input id="ch-gesture-enabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-click-trigger-enabled">Nhấp vào công tắc kích hoạt</label>
            <lớp div="st-chatu8-toggle">
                <input id="ch-click-trigger-enabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-1-button">Cử chỉ 1</label>
            <lớp nút="st-chatu8-btn" id="ch-gesture-1-button">Ghi lại cử chỉ 1</button>
        </div>
        <lớp div="st-chatu8-field">
            <label for="ch-gesture-2-button">Cử chỉ 2</label>
            <lớp nút="st-chatu8-btn" id="ch-gesture-2-button">Ghi lại cử chỉ 2</button>
        </div>
        <lớp div="st-chatu8-field">
            <label for="ch-image-gen-demand-enabled">Cửa sổ bật lên yêu cầu chụp ảnh</label>
            <lớp div="st-chatu8-toggle">
                <input id="ch-image-gen-demand-enabled" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-default-char-demand">Tạo yêu cầu người dùng mặc định cho vai trò</label>
            <id vùng văn bản="ch-default-char-demand" class="st-chatu8-textarea" rows="2" placeholder="Sử dụng giá trị mặc định này khi yêu cầu của người dùng trống..."></textarea>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-default-image-demand">Tạo yêu cầu mặc định của người dùng đối với ảnh</label>
            <id vùng văn bản="ch-default-image-demand" class="st-chatu8-textarea" rows="2" placeholder="Sử dụng giá trị mặc định này khi yêu cầu của người dùng trống..."></textarea>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-show-recognition">Hiển thị nhận dạng</label>
            <lớp div="st-chatu8-toggle">
                <input id="ch-gesture-show-recognition" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-show-trail">Hiển thị chữ viết tay</label>
            <lớp div="st-chatu8-toggle">
                <input id="ch-gesture-show-trail" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-trail-color">Màu chữ viết tay</label>
            <loại đầu vào="color" id="ch-gesture-trail-color" class="st-chatu8-input">
        </div>
        <div class="st-chatu8-field">
            <label for="ch-gesture-match-threshold">Ngưỡng đối sánh</label>
            <loại đầu vào="range" id="ch-gesture-match-threshold" class="st-chatu8-slider-input" min="0" max="100" step="1">
            <span id="ch-gesture-match-threshold-value" class="st-chatu8-slider-value"></span>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h4>Công cụ kiểm tra</h4>
        <lớp div="st-chatu8-field">
            <label for="ch-regex-test-mode">Chế độ kiểm tra</label>
            <lớp div="st-chatu8-toggle">
                <input id="ch-regex-test-mode" type="checkbox" />
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-test-original-text">Văn bản gốc</label>
            <id vùng văn bản="ch-regex-test-original-text" class="st-chatu8-textarea" rows="6"></textarea>
        </div>
        <div style="text-align: center; margin: 10px 0;">
            <button class="st-chatu8-btn" id="ch-test-regex-button">
                <i class="fa-solid fa-arrow-down"></i>
                Áp dụng biểu thức chính quy và kiểm tra
                <lớp tôi="fa-solid fa-arrow-down"></i>
            </button>
        </div>
        <div class="st-chatu8-field-col">
            <label for="ch-regex-test-result-text">Văn bản thông thường</label>
            <id vùng văn bản="ch-regex-test-result-text" class="st-chatu8-textarea" rows="6" readonly></textarea>
        </div>
    </div>
</div>
