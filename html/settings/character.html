                        <li><strong>Nhiều ký tự (nhiều $...$ trong một thẻ):</strong><code>$Tiểu Hồng-sfw-upperbody$, đứng, $Tiểu Lân-sfw-upperbody$, mỉm cười</code></li>
                        <li phong cách="color: var(--SmartThemeEmColor);">Để gỡ lỗi · Chỉ nhận dạng tên: <code>Tên ký tự</code>, <code>Tên ký tự [hiện tại]</code> (quá trình thay thế thực tế không nhận dạng các tên trần như vậy)</li>

                        <li><strong>Trường hợp/không gian:</strong>Tất cả đã bị bỏ qua (văn bản và tên trình kích hoạt sẽ được so sánh với khoảng trắng bị xóa và chuyển thành chữ thường).</li>
                        <li><strong>Số kết quả:</strong>Có thể đánh nhiều nhân vật cùng một lúc; tất cả các nhân vật được bao gồm <code>{{danh sách kích hoạt vai trò}}</code> văn bản.</li>
                    </ul>
                    <div style="margin-top: 8px; font-size: 0.85em; color: var(--SmartThemeEmColor);">
                        Với "Kích hoạt ký tự (<code>$...$</code> Thay thế)" sự khác biệt:<br>
