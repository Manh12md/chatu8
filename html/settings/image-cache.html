<div id="ch-tab-image-cache">
    <div class="st-chatu8-settings-section">
        <h3>Quản lý bộ đệm hình ảnh</h3>
        <lớp div="st-chatu8-cache-controls">
            <button id="image-cache-toggle-multiselect" class="st-chatu8-btn">Nhiều lựa chọn</button>
            <id nút="image-cache-select-all" class="st-chatu8-btn">Chọn tất cả</button>
            <id nút="image-cache-deselect-all" class="st-chatu8-btn">Hủy chọn tất cả</button>
            <id nút="image-cache-download-selected" class="st-chatu8-btn"><i class="fa-solid fa-download"></i> Đã chọn tải xuống</button>
            <id nút="image-cache-delete-selected" class="st-chatu8-btn danger"><i class="fa-solid fa-trash"></i>Xóa đã chọn</button>
        </div>
        <div id="image-cache-grid" class="st-chatu8-image-cache-grid">
            <!-- Images will be loaded here -->
        </div>
        <div id="image-cache-pagination" class="st-chatu8-pagination">
            <!-- Pagination controls will be here -->
            <div class="st-chatu8-field" id="image-cache-jump-container" style="display: none; margin-left: 10px;">
                <label for="image-cache-jump-input">Chuyển tới</label>
                <lớp div="st-chatu8-input-group">
                    <input type="number" id="image-cache-jump-input" class="st-chatu8-page-jump-input" placeholder="Số trang" min="1">
                    <button id="image-cache-jump-button" class="st-chatu8-btn">Nhảy</button>
                </div>
            </div>
        </div>
        <div id="image-cache-info" class="st-chatu8-cache-info"></div>
    </div>
</div>
