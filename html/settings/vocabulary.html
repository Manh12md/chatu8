<div id="ch-tab-vocabulary">
    <div class="st-chatu8-settings-section">
        <h3>Quản lý từ vựng</h3>
        <lớp div="st-chatu8-field">
            <label>Thao tác hàng loạt</label>
            <div>
                <id nút="vocabulary-install-all-btn" class="st-chatu8-btn">Cài đặt tất cả</button>
                <id nút="vocabulary-uninstall-all-btn" class="st-chatu8-btn danger">Gỡ cài đặt tất cả</button>
            </div>
        </div>
        <lớp div="st-chatu8-field-col">
            <label>Từ vựng có sẵn (ba hoặc bốn cài đặt trên điện thoại di động là đủ)</label>
            <div id="vocabulary-file-list" class="st-chatu8-vocabulary-list"></div>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h3>Trình duyệt thẻ</h3>
        <lớp div="st-chatu8-field-col">
            <textarea id="vocabulary-selected-tags" class="st-chatu8-textarea" rows="3" placeholder="Nhấp vào thẻ bên dưới sẽ thêm nó vào đây..."></textarea>
            <div class="st-chatu8-tag-browser-actions">
                <button id="vocabulary-tag-backspace" class="st-chatu8-btn">Quay lại</button>
                <id nút="vocabulary-tag-clear" class="st-chatu8-btn danger">Xóa</button>
                <id nút="vocabulary-tag-copy" class="st-chatu8-btn">Sao chép</button>
            </div>
        </div>
        <div id="vocabulary-tree-container" class="st-chatu8-tree-container"></div>
    </div>
    <div class="st-chatu8-settings-section">
        <h3>Quản lý thẻ thủ công</h3>
        <lớp div="st-chatu8-field-col" style="gap: 10px;">
            <label>Thêm nhãn mới</label>
            <lớp div="st-chatu8-input-group">
                <input type="text" id="vocabulary-manual-tag-original-input" class="st-chatu8-text-input" placeholder="Gắn thẻ văn bản gốc...">
                <input type="text" id="vocabulary-manual-tag-translation-input" class="st-chatu8-text-input" placeholder="Dịch nhãn...">
                <button id="vocabulary-manual-tag-add-btn" class="st-chatu8-btn">Thêm</button>
            </div>
        </div>
        <lớp div="st-chatu8-field">
            <nhãn>Hoạt động</label>
            <id nút="vocabulary-manual-tags-refresh-btn" class="st-chatu8-btn">Làm mới danh sách</button>
        </div>
        <lớp div="st-chatu8-field-col">
            <label>Nhãn được thêm theo cách thủ công</label>
            <div id="vocabulary-manual-tags-list" class="st-chatu8-vocabulary-list" style="max-height: 200px; overflow-y: auto;"></div>
        </div>
    </div>
    <div class="st-chatu8-settings-section">
        <h3>Cài đặt tìm kiếm</h3>
        <lớp div="st-chatu8-field">
            <label for="vocabulary_search_startswith">khớp ngay từ đầu</label>
            <lớp div="st-chatu8-toggle">
                <input id="vocabulary_search_startswith" type="checkbox"/>
                <span class="st-chatu8-slider"></span>
            </div>
        </div>
        <div class="st-chatu8-field">
            <label for="vocabulary_search_limit">Số kết quả tối đa</label>
            <loại đầu vào="number" id="vocabulary_search_limit" class="st-chatu8-text-input" min="1" max="1000">
        </div>
        <div class="st-chatu8-field">
            <label for="vocabulary_search_sort">Sắp xếp theo</label>
            <chọn id="vocabulary_search_sort" class="st-chatu8-select">
                <option value="hot_asc">Theo thứ tự mức độ phổ biến tăng dần</option>
                <giá trị tùy chọn="hot_desc">Theo thứ tự mức độ phổ biến giảm dần</option>
                <giá trị tùy chọn="key_asc">Theo thứ tự tăng dần của tên tiếng Anh</option>
            </select>
        </div>
    </div>
    <lớp div="st-chatu8-settings-section">
        <h3>Kiểm tra</h3>
        <lớp div="st-chatu8-field">
            <label for="vocabulary-search-input">Tìm kiếm</nhãn>
            <lớp div="st-chatu8-input-group">
                <input type="text" id="vocabulary-search-input" class="st-chatu8-text-input" placeholder="Nhập từ khóa...">
                <button id="vocabulary-search-btn" class="st-chatu8-btn">Tìm kiếm</button>
            </div>
        </div>
        <lớp div="st-chatu8-field-col">
            <label>Kết quả tìm kiếm</label>
            <div id="vocabulary-search-results" class="st-chatu8-textarea" style="height: 150px; overflow-y: auto;"></div>
        </div>
    </div>
</div>
